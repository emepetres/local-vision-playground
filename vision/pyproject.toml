[project]
name = "vision"
version = "0.1.0"
description = "Turning Frames into Observations with a local vision-language model"
authors = [
    { name = "Javier Carnero", email = "jcarnero@plainconcepts.com" }
]
requires-python = ">=3.12, <3.13"
dependencies = [
    "foundry-local-sdk>=2.0.1",
    "opencv-python>=5.0.0.93",
    "pillow>=12.3.0",
    "tqdm>=4.70.0",
]

[project.scripts]
observe = "vision.cli:main"
benchmark = "vision.cli:benchmark_main"
watch = "vision.cli:watch_main"

[build-system]
requires = ["uv_build>=0.9.24,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
    "types-tqdm>=4.70.0.20260906",
]
# The conversion toolchain, opt-in and off the demo path. It is pinned in uv.lock so the
# export is reproducible, but it is NOT a default group: `uv sync` never installs it, only
# `uv sync --group convert` does, and nothing in observe / watch / benchmark imports any of
# it (ADR-0012, and tools/convert/README.md). `transformers` is held below 5.0 because
# optimum-intel 2.1.0 rejects it, and at >= 4.57 for native `qwen3_vl` (issue #48, #40).
convert = [
    "openvino==2026.3.0",
    "openvino-genai==2026.3.0",
    "openvino-tokenizers==2026.3.0",
    "optimum==2.3.0",
    "optimum-intel==2.1.0",
    "nncf==3.3.0",
    "transformers>=4.57,<5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "tools"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
