<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="821" viewBox="0 0 1920 821">
  <defs>
    <filter id="glow" x="-30%" y="-40%" width="160%" height="180%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arr" viewBox="0 0 20 20" refX="16" refY="10" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M2,2 L16,10 L2,18" fill="none" stroke="#A2B6CD" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- connectors between layers -->
  <line x1="600" y1="250" x2="600" y2="330" stroke="#3E5D81" stroke-width="5"/>
  <line x1="600" y1="490" x2="600" y2="570" stroke="#3E5D81" stroke-width="5"/>

  <!-- top: Agent Framework -->
  <rect x="120" y="90" width="960" height="160" rx="22" fill="#1A3961" stroke="#00BCF2" stroke-width="4"/>
  <text x="600" y="186" text-anchor="middle" font-family="'Aptos Display', 'Segoe UI Semibold', sans-serif" font-size="44" font-weight="600" fill="#F7FAFF">Microsoft Agent Framework 1.22</text>

  <!-- middle: our IChatClient (focal) -->
  <rect x="330" y="330" width="540" height="160" rx="22" fill="#0078D4" filter="url(#glow)"/>
  <text x="600" y="426" text-anchor="middle" font-family="Consolas, monospace" font-size="46" font-weight="700" fill="#F7FAFF">our IChatClient</text>

  <!-- bottom: Foundry Local -->
  <rect x="120" y="570" width="960" height="160" rx="22" fill="#1A3961" stroke="#7FBA00" stroke-width="4"/>
  <text x="600" y="666" text-anchor="middle" font-family="'Aptos Display', 'Segoe UI Semibold', sans-serif" font-size="44" font-weight="600" fill="#F7FAFF">Foundry Local 2.0.1</text>

  <!-- faded pattern block -->
  <rect x="1260" y="330" width="560" height="160" rx="22" fill="none" stroke="#A2B6CD" stroke-width="4" stroke-dasharray="16 12"/>
  <text x="1540" y="398" text-anchor="middle" font-family="Aptos, 'Segoe UI', sans-serif" font-size="32" fill="#A2B6CD">the pattern:</text>
  <text x="1540" y="446" text-anchor="middle" font-family="Aptos, 'Segoe UI', sans-serif" font-size="32" fill="#A2B6CD">Bruno Capuano's adapter</text>

  <!-- inspired-by connector -->
  <line x1="1250" y1="410" x2="900" y2="410" stroke="#A2B6CD" stroke-width="3" stroke-dasharray="10 10" marker-end="url(#arr)"/>
</svg>
