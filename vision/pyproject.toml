[project]
name = "vision"
version = "0.1.0"
description = "Turning Frames into Observations with a local vision-language model"
authors = [
    { name = "Javier Carnero", email = "jcarnero@plainconcepts.com" }
]
requires-python = ">=3.12, <3.13"
dependencies = [
    "foundry-local-sdk>=2.0.1",
    "pillow>=12.3.0",
]

[project.scripts]
observe = "vision.cli:main"

[build-system]
requires = ["uv_build>=0.9.24,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
